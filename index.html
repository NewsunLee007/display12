function initKPI(){
  var html='';
  var totals=DATA_CLS.filter(function(x){return x.subj==='总分';});
  if(totals.length){
    var avgAc=totals.reduce(function(a,x){return a+x.ac},0)/totals.length;
    var avgT20=totals.reduce(function(a,x){return a+x.t20},0)/totals.length;
    var avgB20=totals.reduce(function(a,x){return a+x.b20_s},0)/totals.length;
    html+='<div class="kpi-card"><div class="num" style="color:'+(avgAc>=0?'#5B8C8C':'#b22222')+'">'+(avgAc>0?'+':'')+avgAc.toFixed(1)+'</div><div class="label">总分均分变化</div></div>';
    html+='<div class="kpi-card"><div class="num" style="color:'+(avgT20>=0?'#5B8C8C':'#b22222')+'">'+(avgT20>0?'+':'')+avgT20.toFixed(1)+'%</div><div class="label">总分前20%变化</div></div>';
    html+='<div class="kpi-card"><div class="num" style="color:'+(avgB20>=0?'#5B8C8C':'#b22222')+'">'+(avgB20>0?'+':'')+avgB20.toFixed(1)+'%</div><div class="label">总分后20%缩减</div></div>';
  }
  SUBJ.forEach(function(s){
    if(s==='总分') return;
    var d=DATA_CLS.filter(function(x){return x.subj===s});
    if(!d.length) return;
    var ac=d.reduce(function(a,x){return a+x.ac},0)/d.length;
    var t20=d.reduce(function(a,x){return a+x.t20},0)/d.length;
    html+='<div class="kpi-card"><div class="num" style="color:'+(ac>=0?'#5B8C8C':'#b22222')+'">'+(ac>0?'+':'')+ac.toFixed(1)+'</div><div class="label">'+s+'均分</div></div>';
  });
  document.getElementById('kpiGrid').innerHTML=html;
}
function tagBadge(tag){
  var m={'明显进步':'badge badge-deepup','进步':'badge badge-up','持平':'badge badge-flat','退步':'badge badge-down','明显退步':'badge badge-deepdown'};
  return '<span class="'+(m[tag]||'badge badge-flat')+'">'+tag+'</span>';
}
function initTabs(){
  var names=['班级诊断','多维明细','群体对比','校际对比','群体明细','图表分析'];
  var bar=document.getElementById('tabBar');
  bar.innerHTML=names.map(function(n,i){return '<button class="tab'+(i===0?' active':'')+'" data-idx="'+i+'">'+n+'</button>';}).join('');
  document.getElementById('panels').innerHTML=names.map(function(n,i){return '<div class="panel'+(i===0?' active':'')+'" id="p'+i+'"></div>';}).join('');
  bar.addEventListener('click',function(e){
    if(!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    e.target.classList.add('active');
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
    document.getElementById('p'+e.target.dataset.idx).classList.add('active');
  });
}

  var classes=[...new Set(DATA_CLS.map(function(d){return d.cls;}))].sort();

function filterT1(){
  var fc=document.getElementById('f1c').value;
  var ft=document.getElementById('f1t').value;
  var cmap={};
  DATA_CLS.forEach(function(d){
    if(fc && d.cls!==fc) return;
    if(ft==='up' && d.tag.indexOf('进步')===-1) return;
    if(ft==='down' && d.tag.indexOf('退步')===-1) return;
    if(ft==='flat' && (d.tag.indexOf('进步')!==-1||d.tag.indexOf('退步')!==-1)) return;
    if(!cmap[d.cls]) cmap[d.cls]={cls:d.cls,subjs:{},prog:[],regr:[]};
    cmap[d.cls].subjs[d.subj]=d;
    if(d.tag.indexOf('进步')!==-1) cmap[d.cls].prog.push(d.subj);
    if(d.tag.indexOf('退步')!==-1) cmap[d.cls].regr.push(d.subj);
  });
  var rows='';
  Object.values(cmap).sort(function(a,b){return a.cls.localeCompare(b.cls);}).forEach(function(c){
    rows+='<tr><td><b>'+c.cls+'</b></td>';
    DISP_SUBJ.forEach(function(s){
      var d=c.subjs[s];
      if(!d){rows+='<td>—</td>';return;}
      rows+='<td>'+tagBadge(d.tag)+'<br><small style="color:'+(d.ac>=0?'#2d6a2d':'#b22222')+'">均'+(d.ac>0?'+':'')+d.ac.toFixed(1)+'</small></td>';
    });
    rows+='<td>'+(c.prog.length?c.prog.join('/'):'—')+'</td>';
    rows+='<td>'+(c.regr.length?'<span style="color:#b22222">'+c.regr.join('/')+'</span>':'—')+'</td></tr>';
  });
  document.getElementById('t1b').innerHTML=rows;
}

  if(fg) data=data.filter(function(d){return d.grp===fg;});

    var t20c=round2(d.e_t20-d.y_t20); var t40c=round2(d.e_t40-d.y_t40);

  }).join('');
}

function filterT5(){
  var fg=document.getElementById('f5g').value;
  var fe=document.getElementById('f5e').value;
  var data=DATA_STUDENT;
  if(fg) data=data.filter(function(d){return d.grp===fg;});
  if(fe==='进步') data=data.filter(function(d){return d.eq.some(function(e){return e && e.indexOf('进步')!==-1});});
  if(fe==='退步') data=data.filter(function(d){return d.eq.some(function(e){return e && e.indexOf('退步')!==-1});});
  if(fe==='稳定') data=data.filter(function(d){return d.eq.every(function(e){return e && e.indexOf('基本稳定')!==-1});});
  document.getElementById('t5b').innerHTML=data.map(function(d){
    var subs=['语文','数学','英语','科学','社会','总分'];
    var cells='';
    for(var i=0;i<6;i++){
      var diff=d.diffs[i]; var eq=d.eq[i];
      var dc='style="color:'+(diff>=0?'#2d6a2d':'#b22222')+'"';
      var ec='';
      if(eq && eq.indexOf('进步')!==-1) ec='style="background:#c5e0b4;color:#2d6a2d;padding:2px 6px;border-radius:4px"';
      else if(eq && eq.indexOf('退步')!==-1) ec='style="background:#f4cccc;color:#b22222;padding:2px 6px;border-radius:4px"';
      cells+='<td '+dc+'>'+(diff>0?'+':'')+(diff?diff.toFixed(1):'—')+'</td>';
      cells+='<td><span '+ec+'>'+(eq||'—')+'</span></td>';
    }
    return '<tr><td><b>'+d.grp+'</b></td><td>'+d.name+'</td><td>'+d.cls+'</td>'+cells+'</tr>';
  }).join('');
}

var charts={};

  Object.values(charts).forEach(function(c){try{c.destroy()}catch(e){}});
  var ac=SUBJ.map(function(s){var d=DATA_CLS.filter(function(x){return x.subj===s});return d.length?d.reduce(function(a,x){return a+x.ac},0)/d.length:0;});

  charts.ch3=new Chart(document.getElementById('ch3'),{type:'bar',data:{labels:grps,datasets:[{label:'一模前20%',data:gt20.map(function(d){return d.y;}),backgroundColor:'rgba(91,140,140,0.5)'},{label:'二模前20%',data:gt20.map(function(d){return d.e;}),backgroundColor:'rgba(91,140,140,0.9)'}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{grid:{color:'#eee'}}}}});
  var isj=DATA_INTER.map(function(d){return d.subj;});
  var zrk=DATA_INTER.map(function(d){return d.y_zrk-d.e_zrk;});
  charts.ch4=new Chart(document.getElementById('ch4'),{type:'bar',data:{labels:isj,datasets:[{label:'Z分排名变化(正=进步)',data:zrk,backgroundColor:zrk.map(function(v){return v>=0?'rgba(91,140,140,0.7)':'rgba(212,165,165,0.7)';}),borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#eee'}}}}});
}
